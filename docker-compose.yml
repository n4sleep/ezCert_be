services:
  postgres:
    image: postgres:16-alpine
    container_name: ezcert-postgres
    environment:
      POSTGRES_USER: ezcert
      POSTGRES_PASSWORD: ezcert
      POSTGRES_DB: ezcert
    ports:
      - "5432:5432"
    volumes:
      - ezcert-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ezcert -d ezcert"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: ezcert-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ezcert-qdrant:/qdrant/storage

volumes:
  ezcert-pgdata:
  ezcert-qdrant:
