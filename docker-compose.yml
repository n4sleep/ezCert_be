services:
  postgres:
    image: postgres:16-alpine
    container_name: ezcert-postgres
    environment:
      POSTGRES_DB: ezcert
      POSTGRES_USER: ezcert
      POSTGRES_PASSWORD: ezcert
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: ezcert-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  postgres-data:
  qdrant-data:
